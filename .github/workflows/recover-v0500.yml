name: Recover v0.50.0

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-golembot-v0.50.0
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.50.0
          persist-credentials: false

      - name: Verify release identity
        run: |
          test "$(git rev-parse HEAD)" = ffff178db0e9eacfcdc92908f82a8ce92622ec4d
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); if (p.name !== "golembot" || p.version !== "0.50.0") process.exit(1);'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Check npm publication
        id: npm
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const response = await fetch('https://registry.npmjs.org/golembot/0.50.0');
          if (response.status === 404) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'published=false\n');
          } else {
            if (!response.ok) throw new Error(`npm registry returned ${response.status}`);
            const pkg = await response.json();
            if (pkg.name !== 'golembot' || pkg.version !== '0.50.0') throw new Error('Unexpected package identity');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'published=true\n');
          }
          NODE

      - name: Publish missing npm package
        if: steps.npm.outputs.published == 'false'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --registry=https://registry.npmjs.org --tag latest --access public --provenance=false

      - name: Verify npm package
        run: npm view golembot@0.50.0 version --registry=https://registry.npmjs.org

      - name: Create missing GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: 0xranx/golembot
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const start = changelog.indexOf('# [0.50.0]');
          if (start < 0) throw new Error('Release notes not found');
          const section = changelog.slice(start);
          const next = section.search(/\n#{1,2} \[/);
          fs.writeFileSync('/tmp/release-notes.md', next < 0 ? section : section.slice(0, next));
          NODE
          if ! gh release view v0.50.0; then
            gh release create v0.50.0 --verify-tag --title v0.50.0 --notes-file /tmp/release-notes.md
          fi
